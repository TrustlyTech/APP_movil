name: facelab
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2       # Permite capturar imágenes de la cámara o galería
  http: ^1.4.0                # Para realizar solicitudes HTTP (como enviar imágenes)
  camera: ^0.11.0+2            # Para gestionar la cámara en tiempo real
  url_launcher: ^6.1.10        # Para manejar enlaces y llamadas telefónicas
  cupertino_icons: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  fl_chart: ^1.0.0
  intl: ^0.18.1      

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0  
  flutter_launcher_icons: ^0.14.4      # Conjunto de buenas prácticas de codificación
  fl_chart: ^1.0.0
  intl: ^0.18.1

flutter:
  uses-material-design: true

  assets:
    - assets/person_placeholder.png
    - assets/tabler_spy.png
    - assets/incon.png
    - assets/login.png
    - assets/identity.png
    - assets/scraping.png
    

      # Imagen de marcador de posición para coincidencias encontradas (opcional)

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/identity.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/identity.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/identity.png"
    icon_size: 128
  macos:
    generate: true
    image_path: "assets/identity.png"

# Notas:
# - Se actualizó el SDK de Dart a una versión compatible con los últimos paquetes.
# - La versión de `flutter_lints` se redujo para compatibilidad en proyectos con versiones antiguas de Flutter.
